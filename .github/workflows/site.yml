name: Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false  # aguarda deploy anterior terminar

jobs:
  # Etapa 1: validação
  validate:
    name: Validate Static Files
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Check for files
      run: |
        test -f site/index.html || (echo "::error::index.html não encontrado!" && exit 1)
        echo "Arquivos estáticos encontrados, prosseguindo com deploy."

  # Etapa 2: deploy
  deploy:
    name: Deploy Site to Production
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Site to Server
        uses: easingthemes/ssh-deploy@v5.1.0 
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          SOURCE: "site/"
          TARGET: "/var/www/portfolio/site/"
          ARGS: "-rlgoDz --delete"
          EXCLUDE: ".git/, .gitignore, README.md"
          SCRIPT_AFTER: |
            set -e
            echo "Deploy concluído: $(date)"

      - name: Notify on failure
        if: failure()
        run: echo "::error::Deploy do site falhou! Verifique os logs."