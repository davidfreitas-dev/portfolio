name: Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false  # aguarda deploy anterior terminar

jobs:
  # Etapa 1: validação
  validate:
    name: Validate Static Files
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      # Adapte (ou remova) os passos abaixo conforme sua stack
      - name: Install dev tools
        run: npm ci

      - name: Lint HTML
        run: npx htmlhint "**/*.html"

      - name: Lint CSS
        run: npx stylelint "**/*.css"

  # Etapa 2: deploy
  deploy:
    name: Deploy Site to Production
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Site to Server
        uses: easingthemes/ssh-deploy@v5.1.0  # versão fixada
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          SOURCE: "site/"
          TARGET: "/var/www/portfolio/site/"
          ARGS: "-rlgoDz --delete"  # removido -i e -c
          EXCLUDE: ".git/, .gitignore, README.md, package.json,
                    package-lock.json, node_modules/, .htmlhintrc,
                    .stylelintrc"
          # Permissões só se realmente necessário ajustar no servidor.
          # Prefira configurar uma vez direto na VPS e remover daqui.
          SCRIPT_AFTER: |
            set -e
            echo "Deploy concluído: $(date)"

      - name: Notify on failure
        if: failure()
        run: echo "::error::Deploy do site falhou! Verifique os logs."