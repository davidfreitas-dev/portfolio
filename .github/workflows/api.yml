name: Deploy API

on:
  push:
    paths:
      - 'api/**'
    branches: [main]
    
  workflow_dispatch:

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        working-directory: api

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --no-interaction --prefer-dist
        working-directory: api

      - name: Check Code Style
        run: composer cs-fix -- --dry-run --diff
        working-directory: api

      - name: Static Analysis (Rector)
        run: composer rector:dry
        working-directory: api

  deploy:
    name: Deploy to Production
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          SOURCE: "api/"
          TARGET: "/var/www/portfolio/api/"
          ARGS: "-rlgoDzvc -i --delete"
          EXCLUDE: "README.md, .git/, .gitignore, .env.example, .dockerignore, docker-compose.yml, Dockerfile, .docker/, docs/, tools/, vendor/, logs/, .env"
          SCRIPT_AFTER: |
            cd /var/www/portfolio/api
            composer install --no-dev --optimize-autoloader --no-interaction
            sudo systemctl reload php8.4-fpm