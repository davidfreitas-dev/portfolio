name: Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - "site/**"

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Site to Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Site to Server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          SOURCE: "site/"
          TARGET: "/var/www/portfolio/site/"
          ARGS: "-rlzvc -i --delete"
          EXCLUDE: "/.git/, .gitignore, README.md"
          SCRIPT_AFTER: |
            sudo chown -R www-data:www-data /var/www/portfolio/site
            sudo find /var/www/portfolio/site -type d -exec chmod 775 {} +
            sudo find /var/www/portfolio/site -type f -exec chmod 664 {} +
